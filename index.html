// ─── SHARED UI ────────────────────────────────────────────────────────────────
function Header({ sub, right, cor }) {

        {right}
      </div>

function Btn({ onClick, children, variant="primary", disabled, small }) {
  const bg = variant==="secondary"?"transparent":variant==="ghost"?"transparent":variant==="green"?"#25D366":variant==="danger"?"#e74c3c":"linear-gradient(135deg,#2C3E1A,#4A5C2E)";
  const color = variant==="secondary"?"#4A5C2E":variant==="ghost"?"#aaa":"#fff";
  const border = variant==="secondary"?"1.5px solid #4A5C2E":variant==="ghost"?"1px solid #eee":"none";
  return (
    <button onClick={onClick} disabled={disabled}
      style={{background:bg,color:color,border:border,borderRadius:10,
        padding:small?"8px 16px":"13px 0",fontSize:small?12:14,
        cursor:disabled?"not-allowed":"pointer",fontFamily:"Arial,sans-serif",
        fontWeight:700,width:small?undefined:"100%",opacity:disabled?0.6:1}}>
      {children}
    </button>
  );
}

function Input({ label, value, onChange, placeholder, type="text" }) {
  return (
    <div style={{marginBottom:14}}>
      {label&&<label style={{fontSize:11,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:.8,fontFamily:"Arial,sans-serif",display:"block",marginBottom:6}}>{label}</label>}
      <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} type={type}
        style={{width:"100%",border:"1.5px solid #e0e0e0",borderRadius:10,padding:"12px 14px",fontSize:15,fontFamily:"Arial,sans-serif",outline:"none",boxSizing:"border-box"}}/>
    </div>
  );
}

function Card({ children, style, onClick }) {
  const base = {background:"#fff",borderRadius:14,padding:"16px",boxShadow:"0 2px 10px rgba(0,0,0,0.07)",cursor:onClick?"pointer":"default"};
  const merged = Object.assign({}, base, style || {});
  return (
    <div onClick={onClick} style={merged}>
      {children}
    </div>
  );
}

function MetaBar({ compras, label }) {
  const m = proxMeta(compras);
  const atual = calcMeta(compras);
  if (!m && !atual) return null;
  const base = (atual ? atual.compras : 0);
  const target = m ? m.compras : CFG.metas[CFG.metas.length-1].compras;
  const pct = m ? Math.min(((compras-base)/(m.compras-base))*100,100) : 100;
  return (
    <div style={{background:"#F0F7EB",borderRadius:10,padding:"10px 12px"}}>
      {m && <div style={{fontSize:12,color:"#4A5C2E",fontFamily:"Arial,sans-serif",marginBottom:5}}>
        Faltam <strong>{m.compras-compras} compras</strong> para {m.icon} Meta {m.label} (R${m.credito})
      </div>}
      {!m && <div style={{fontSize:12,color:"#E65100",fontFamily:"Arial,sans-serif",fontWeight:700,marginBottom:5}}>🥇 Meta Ouro atingida!</div>}
      <div style={{height:6,background:"#C8E6C9",borderRadius:3}}>
        <div style={{height:6,background:(atual ? atual.cor : null)||"#4A5C2E",borderRadius:3,width:`${pct}%`,transition:"width .3s"}}/>
      </div>
      <div style={{fontSize:10,color:"#888",fontFamily:"Arial,sans-serif",marginTop:4}}>
        {compras}/{target} compras
      </div>
    </div>
  );
}

// ─── CADASTRO CLIENTE ─────────────────────────────────────────────────────────
function PaginaCadastro({ parceiro, setTela, setDadosVoucher }) {
  const [nome, setNome] = useState("");
  const [wpp, setWpp] = useState("");
  const [loading, setLoading] = useState(false);
  const [erro, setErro] = useState("");

  const submit = async () => {
    if (!nome.trim()||nome.trim().length<3){setErro("Digite seu nome completo");return;}
    if (wpp.replace(/\D/g,'').length<10){setErro("WhatsApp inválido — inclua o DDD");return;}
    setErro(""); setLoading(true);
    const codigo = gerarCodigo(parceiro.id);
    const cliente = { id: codigo, codigo, nome:nome.trim(), whatsapp:wpp.trim(),
      parceiroId:parceiro.id, parceiro:parceiro.nome, loja:parceiro.loja,
      mes:mesAtual(), data:dataHoje(), cadastroAt:agora() };
    await db.addCliente(cliente);
    // Notify WhatsApp
    const msg = encodeURIComponent(`🌿 *Nova Indicação — Revita Indica*\n\n👤 Cliente: ${nome.trim()}\n🏋️ Parceiro: ${parceiro.nome}\n🎟️ Código: ${codigo}\n💰 ${CFG.desconto}% de desconto em compras acima de R$${CFG.minCompra}\n\n✅ Confirme para registrar!`);
    window.open(`https://wa.me/${CFG.whatsapp}?text=${msg}`,'_blank');
    setTimeout(()=>{ setLoading(false); setDadosVoucher(cliente); setTela('voucher'); },800);
  };

  return (
    <div style={{minHeight:"100vh",background:"#F7F5F0"}}>
      <Header sub={parceiro.nome}/>
      <div style={{maxWidth:480,margin:"0 auto",padding:"24px 20px 40px"}}>
        <button onClick={()=>setTela('home')} style={{background:"transparent",border:"none",cursor:"pointer",fontSize:13,color:"#888",fontFamily:"Arial,sans-serif",marginBottom:20,padding:0}}>← Voltar</button>
        <div style={{background:`${parceiro.cor}12`,borderRadius:14,padding:"16px 18px",marginBottom:20,borderLeft:`4px solid ${parceiro.cor}`}}>
          <div style={{fontSize:10,color:parceiro.cor,textTransform:"uppercase",letterSpacing:1,fontFamily:"Arial,sans-serif",fontWeight:700,marginBottom:4}}>Indicado por</div>
          <div style={{fontSize:20,fontWeight:700,color:"#1A2E0A",fontFamily:"Georgia,serif"}}>{parceiro.nome}</div>
          <div style={{fontSize:12,color:"#888",fontFamily:"Arial,sans-serif"}}>{parceiro.tipo} • Loja {parceiro.loja}</div>
        </div>
        <Card style={{marginBottom:16}}>
          <div style={{fontSize:15,fontWeight:700,color:"#1A2E0A",marginBottom:6}}>Cadastre-se e ganhe seu desconto</div>
          <div style={{background:"#F0F7EB",borderRadius:10,padding:"12px",marginBottom:18}}>
            <div style={{fontSize:14,fontWeight:700,color:"#4A5C2E",fontFamily:"Arial,sans-serif"}}>🎟️ {CFG.desconto}% de desconto em todas as compras</div>
            <div style={{fontSize:12,color:"#666",fontFamily:"Arial,sans-serif",marginTop:3}}>Compras acima de R${CFG.minCompra} • Sem limite de uso mensal</div>
          </div>
          <Input label="Seu nome completo" value={nome} onChange={setNome} placeholder="Ex: Maria da Silva"/>
          <Input label="WhatsApp com DDD" value={wpp} onChange={setWpp} placeholder="17 99999-9999" type="tel"/>
          {erro&&<div style={{color:"#e74c3c",fontSize:12,fontFamily:"Arial,sans-serif",marginBottom:12}}>⚠️ {erro}</div>}
          <Btn onClick={submit} disabled={loading}>{loading?"Gerando voucher... 🎟️":`Quero meu desconto de ${CFG.desconto}% →`}</Btn>
        </Card>
      </div>
    </div>
  );
}

// ─── BUSCA VOUCHER CLIENTE ────────────────────────────────────────────────────
function PaginaBuscaVoucher({ setTela, setDadosVoucher }) {
  const [wpp, setWpp] = useState("");
  const [erro, setErro] = useState("");

  const buscar = async () => {
    const clientes = await db.getClientes();
    const nums = wpp.replace(/\D/g,'');
    const c = clientes.find(x => x.whatsapp.replace(/\D/g,'').includes(nums) && nums.length>=8);
    if (c) { setDadosVoucher(c); setTela('voucher'); }
    else setErro("Cadastro não encontrado. Peça ao seu parceiro para indicar você.");
  };

  return (
    <div style={{minHeight:"100vh",background:"#F7F5F0"}}>
      <Header/>
      <div style={{maxWidth:480,margin:"0 auto",padding:"32px 20px 40px"}}>
        <button onClick={()=>setTela('home')} style={{background:"transparent",border:"none",cursor:"pointer",fontSize:13,color:"#888",fontFamily:"Arial,sans-serif",marginBottom:24,padding:0}}>← Voltar</button>
        <Card>
          <div style={{fontSize:16,fontWeight:700,color:"#1A2E0A",marginBottom:6}}>Acessar meu voucher</div>
          <div style={{fontSize:13,color:"#888",fontFamily:"Arial,sans-serif",marginBottom:16}}>Digite o WhatsApp cadastrado para encontrar seu voucher.</div>
          <Input label="Seu WhatsApp" value={wpp} onChange={setWpp} placeholder="17 99999-9999" type="tel"/>
          {erro&&<div style={{color:"#e74c3c",fontSize:12,fontFamily:"Arial,sans-serif",marginBottom:12}}>⚠️ {erro}</div>}
          <Btn onClick={buscar}>Buscar meu voucher</Btn>
        </Card>
      </div>
    </div>
  );
}

// ─── ABA REGISTRAR COMPRA ─────────────────────────────────────────────────────
function AbaRegistrar({ onRegistrar, mes }) {
  const [codigo, setCodigo] = useState("");
  const [valor, setValor] = useState("");
  const [cliente, setCliente] = useState(null);
  const [sucesso, setSucesso] = useState(false);
  const [erro, setErro] = useState("");

  const buscarCliente = async () => {
    setErro(""); setCliente(null); setSucesso(false);
    const clientes = await db.getClientes();
    const c = clientes.find(x=>x.codigo.toUpperCase()===codigo.toUpperCase().trim());
    if (c) setCliente(c);
    else setErro("Código não encontrado. Verifique e tente novamente.");
  };

  const confirmar = async () => {
    if (!valor||isNaN(Number(valor))||Number(valor)<CFG.minCompra){setErro(`Valor mínimo R$${CFG.minCompra}`);return;}
    const compra = {
      id: Date.now()+"",
      codigo: cliente.codigo, clienteId: cliente.id,
      nomeCliente: cliente.nome, whatsappCliente: cliente.whatsapp,
      parceiroId: cliente.parceiroId, parceiro: cliente.parceiro,
      loja: cliente.loja, valor: Number(valor),
      desconto: Math.round(Number(valor)*CFG.desconto/100),
      mes, data: dataHoje(), registradoEm: agora(),
    };
    await db.addCompra(compra);
    await onRegistrar();
    setSucesso(true); setCodigo(""); setValor(""); setCliente(null);
    setTimeout(()=>setSucesso(false),4000);
  };

  return (
    <div>
      <div style={{fontSize:15,fontWeight:700,color:"#1A2E0A",marginBottom:14}}>✅ Registrar compra com voucher</div>
      {sucesso&&(
        <div style={{background:"#27ae6020",border:"1px solid #27ae60",borderRadius:10,padding:"12px",marginBottom:14,textAlign:"center",fontSize:13,color:"#27ae60",fontWeight:700,fontFamily:"Arial,sans-serif"}}>
          ✅ Compra registrada com sucesso!
        </div>
      )}
      <Card style={{marginBottom:12}}>
        <Input label="Código do voucher" value={codigo} onChange={v=>{setCodigo(v);setCliente(null);setErro("");}} placeholder="Ex: REV-AB12"/>
        <Btn onClick={buscarCliente}>Buscar cliente</Btn>
      </Card>

      {erro&&<div style={{background:"#e74c3c18",border:"1px solid #e74c3c",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:12,color:"#e74c3c",fontFamily:"Arial,sans-serif"}}>⚠️ {erro}</div>}

      {cliente&&(
        <Card style={{borderLeft:"4px solid #4A5C2E",marginBottom:12}}>
          <div style={{fontSize:11,color:"#4A5C2E",textTransform:"uppercase",letterSpacing:1,fontFamily:"Arial,sans-serif",fontWeight:700,marginBottom:6}}>Cliente encontrado</div>
          <div style={{fontSize:16,fontWeight:700,color:"#1A2E0A",fontFamily:"Georgia,serif"}}>{cliente.nome}</div>
          <div style={{fontSize:12,color:"#888",fontFamily:"Arial,sans-serif"}}>{cliente.whatsapp} • Parceiro: {cliente.parceiro}</div>
          <div style={{height:1,background:"#f0f0f0",margin:"12px 0"}}/>
          <Input label={`Valor da compra (mín. R$${CFG.minCompra})`} value={valor} onChange={setValor} placeholder="0.00" type="number"/>
          {valor&&Number(valor)>=CFG.minCompra&&(
            <div style={{background:"#F0F7EB",borderRadius:8,padding:"8px 10px",marginBottom:12,fontSize:12,color:"#4A5C2E",fontFamily:"Arial,sans-serif",fontWeight:700}}>
              💰 Desconto aplicado: {fmtR(Number(valor)*CFG.desconto/100)} ({CFG.desconto}%) → Cliente paga {fmtR(Number(valor)*(1-CFG.desconto/100))}
            </div>
          )}
          <Btn onClick={confirmar}>✅ Confirmar compra</Btn>
        </Card>
      )}
    </div>
  );
}

// ─── ABA CLIENTES ─────────────────────────────────────────────────────────────
function AbaClientes({ clientes, compras, mes }) {
  const [busca, setBusca] = useState("");
  const clientesComDados = clientes
    .filter(c=>!busca||c.nome.toLowerCase().includes(busca.toLowerCase())||c.whatsapp.includes(busca))
    .map(c=>{
      const comprasMes = compras.filter(x=>x.clienteId===c.id&&x.mes===mes);
      const totalMes = comprasMes.reduce((a,x)=>a+Number(x.valor),0);
      const totalGeral = compras.filter(x=>x.clienteId===c.id).reduce((a,x)=>a+Number(x.valor),0);
      return {...c, comprasMes:comprasMes.length, totalMes, totalGeral};
    }).sort((a,b)=>b.comprasMes-a.comprasMes);

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{fontSize:15,fontWeight:700,color:"#1A2E0A"}}>👥 Clientes cadastrados</div>
        <div style={{fontSize:12,color:"#888",fontFamily:"Arial,sans-serif"}}>{clientes.length} total</div>
      </div>
      <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por nome ou WhatsApp..."
        style={{width:"100%",border:"1.5px solid #e0e0e0",borderRadius:10,padding:"10px 14px",fontSize:13,fontFamily:"Arial,sans-serif",outline:"none",boxSizing:"border-box",marginBottom:12}}/>

      {clientesComDados.length===0?
        <Card style={{textAlign:"center",color:"#aaa",fontFamily:"Arial,sans-serif",fontSize:13}}>Nenhum cliente ainda.</Card>:
        clientesComDados.map((c,i)=>(
          <Card key={i} style={{marginBottom:8}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:8}}>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:"#1A2E0A",fontFamily:"Arial,sans-serif"}}>{c.nome}</div>
                <div style={{fontSize:11,color:"#888",fontFamily:"Arial,sans-serif"}}>{c.whatsapp}</div>
                <div style={{fontSize:11,color:"#4A5C2E",fontFamily:"Arial,sans-serif",marginTop:2}}>🏋️ {c.parceiro} • {c.loja}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:11,color:"#888",fontFamily:"Arial,sans-serif"}}>Compras no mês</div>
                <div style={{fontSize:22,fontWeight:700,color:"#4A5C2E",fontFamily:"Arial,sans-serif"}}>{c.comprasMes}</div>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[
                {label:"Receita no mês",valor:fmtR(c.totalMes),cor:"#4A5C2E"},
                {label:"Receita total",valor:fmtR(c.totalGeral),cor:"#1A5C8B"},
              ].map((m,j)=>(
                <div key={j} style={{background:"#F9F9F9",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                  <div style={{fontSize:14,fontWeight:700,color:m.cor,fontFamily:"Arial,sans-serif"}}>{m.valor}</div>
                  <div style={{fontSize:10,color:"#aaa",fontFamily:"Arial,sans-serif"}}>{m.label}</div>
                </div>
              ))}
            </div>
          </Card>
        ))
      }
    </div>
  );
}

// ─── ABA PARCEIROS ────────────────────────────────────────────────────────────
function AbaParceiros({ compras, clientes, mes }) {
  const parceirosData = PARCEIROS.map(p=>{
    const comprasMes = compras.filter(x=>x.parceiroId===p.id&&x.mes===mes);
    const totalMes = comprasMes.reduce((a,x)=>a+Number(x.valor),0);
    const totalGeral = compras.filter(x=>x.parceiroId===p.id).reduce((a,x)=>a+Number(x.valor),0);
    const clientesMes = clientes.filter(x=>x.parceiroId===p.id&&x.mes===mes).length;
    const meta = calcMeta(comprasMes.length);
    const prox = proxMeta(comprasMes.length);
    return {...p, comprasMes:comprasMes.length, totalMes, totalGeral, clientesMes, meta, prox};
  }).sort((a,b)=>b.comprasMes-a.comprasMes);

  return (
    <div>
      <div style={{fontSize:15,fontWeight:700,color:"#1A2E0A",marginBottom:14}}>🏆 Performance dos Parceiros — {mes}</div>
      {parceirosData.map((p,i)=>(
        <Card key={p.id} style={{marginBottom:12,borderTop:`3px solid ${i===0?"#FFD700":i===1?"#C0C0C0":i===2?"#CD7F32":p.cor}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <span style={{fontSize:20}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":tipoIcon(p.tipo)}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700,color:"#1A2E0A",fontFamily:"Arial,sans-serif"}}>{p.nome}</div>
              <div style={{fontSize:11,color:"#888",fontFamily:"Arial,sans-serif"}}>{p.tipo} • Loja {p.loja}</div>
            </div>
            {p.meta?
              <div style={{background:`${p.meta.cor}20`,borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700,color:p.meta.cor}}>{p.meta.icon} {p.meta.label}</div>:
              <div style={{background:"#f5f5f5",borderRadius:20,padding:"3px 10px",fontSize:11,color:"#ccc",fontFamily:"Arial,sans-serif"}}>Sem meta</div>
            }
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:10}}>
            {[
              {label:"Compras",valor:p.comprasMes,cor:"#4A5C2E"},
              {label:"Clientes",valor:p.clientesMes,cor:"#1A5C8B"},
              {label:"Receita mês",valor:fmtR(p.totalMes),cor:"#2E7D32"},
              {label:"Receita total",valor:fmtR(p.totalGeral),cor:"#E65100"},
            ].map((m,j)=>(
              <div key={j} style={{background:"#F9F9F9",borderRadius:8,padding:"8px 4px",textAlign:"center"}}>
                <div style={{fontSize:13,fontWeight:700,color:m.cor,fontFamily:"Arial,sans-serif"}}>{m.valor}</div>
                <div style={{fontSize:9,color:"#aaa",fontFamily:"Arial,sans-serif"}}>{m.label}</div>
              </div>
            ))}
          </div>
          <MetaBar compras={p.comprasMes}/>
          {(p.meta && p.meta.compras>=40)&&(
            <div style={{marginTop:8,background:"linear-gradient(135deg,#1A2E0A,#2C3E1A)",borderRadius:8,padding:"7px 10px",display:"flex",alignItems:"center",gap:6}}>
              <span>💎</span>
              <span style={{fontSize:11,color:"#A8D070",fontFamily:"Arial,sans-serif",fontWeight:700}}>Na corrida para a Certificação Revita Elite!</span>
            </div>
          )}
          {p.meta&&(
            <div style={{marginTop:8,background:"#FFF8E1",borderRadius:8,padding:"7px 10px",fontSize:11,color:"#E65100",fontFamily:"Arial,sans-serif",fontWeight:700}}>
              💰 Crédito a pagar: R${p.meta.credito} em produtos
            </div>
          )}
        </Card>
      ))}
    </div>
  );
}

// ─── ABA DASHBOARD ────────────────────────────────────────────────────────────
function AbaDashboard({ comprasMes, clientesMes, receita, mes }) {
  const descontoTotal = comprasMes.reduce((a,c)=>a+Number(c.desconto||0),0);
  const mediaCompra = comprasMes.length ? receita/comprasMes.length : 0;
  const porParceiro = PARCEIROS.map(p=>({
    ...p,
    compras: comprasMes.filter(x=>x.parceiroId===p.id).length,
    receita: comprasMes.filter(x=>x.parceiroId===p.id).reduce((a,x)=>a+Number(x.valor),0),
  })).sort((a,b)=>b.receita-a.receita);

  const maxReceita = Math.max(...porParceiro.map(x=>x.receita),1);

  return (
    <div>
      <div style={{fontSize:15,fontWeight:700,color:"#1A2E0A",marginBottom:14}}>📊 Dashboard — {mes}</div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {[
          {label:"Compras no mês",valor:comprasMes.length,icon:"🛒",cor:"#4A5C2E"},
          {label:"Clientes novos",valor:clientesMes.length,icon:"👥",cor:"#1A5C8B"},
          {label:"Receita gerada",valor:fmtR(receita),icon:"💰",cor:"#2E7D32"},
          {label:"Descontos dados",valor:fmtR(descontoTotal),icon:"🎟️",cor:"#E65100"},
          {label:"Ticket médio",valor:fmtR(mediaCompra),icon:"📈",cor:"#8B4A6B"},
          {label:"Receita líquida",valor:fmtR(receita-descontoTotal),icon:"✅",cor:"#2C3E1A"},
        ].map((m,i)=>(
          <Card key={i} style={{borderTop:`3px solid ${m.cor}`}}>
            <div style={{fontSize:20,marginBottom:4}}>{m.icon}</div>
            <div style={{fontSize:18,fontWeight:700,color:m.cor,fontFamily:"Arial,sans-serif"}}>{m.valor}</div>
            <div style={{fontSize:11,color:"#888",fontFamily:"Arial,sans-serif"}}>{m.label}</div>
          </Card>
        ))}
      </div>

      <Card style={{marginBottom:16}}>
        <div style={{fontSize:14,fontWeight:700,color:"#1A2E0A",marginBottom:14}}>Receita por parceiro</div>
        {porParceiro.map((p,i)=>(
          <div key={p.id} style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:12,fontFamily:"Arial,sans-serif",color:"#333",fontWeight:600}}>{p.nome}</span>
              <span style={{fontSize:12,fontFamily:"Arial,sans-serif",color:"#4A5C2E",fontWeight:700}}>{fmtR(p.receita)} ({p.compras} compras)</span>
            </div>
            <div style={{height:8,background:"#f0f0f0",borderRadius:4}}>
              <div style={{height:8,background:p.cor,borderRadius:4,width:`${(p.receita/maxReceita)*100}%`,transition:"width .3s"}}/>
            </div>
          </div>
        ))}
      </Card>

      <Card>
        <div style={{fontSize:14,fontWeight:700,color:"#1A2E0A",marginBottom:10}}>💎 Status das metas</div>
        {PARCEIROS.map((p,i)=>{
          const n = comprasMes.filter(x=>x.parceiroId===p.id).length;
          const m = calcMeta(n);
          return (
            <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<PARCEIROS.length-1?"1px solid #f0f0f0":"none"}}>
              <span style={{fontSize:16}}>{tipoIcon(p.tipo)}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:700,color:"#1A2E0A",fontFamily:"Arial,sans-serif"}}>{p.nome}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:12,fontFamily:"Arial,sans-serif",color:"#888"}}>{n} compras</span>
                {m?<div style={{background:`${m.cor}20`,borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700,color:m.cor}}>{m.icon} R${m.credito}</div>:
                  <div style={{background:"#f5f5f5",borderRadius:20,padding:"2px 8px",fontSize:10,color:"#ccc",fontFamily:"Arial,sans-serif"}}>—</div>}
              </div>
            </div>
          );
        })}
      </Card>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [tela, setTela] = useState("home");
  const [parceiroAtivo, setParceiroAtivo] = useState(null);
  const [dadosVoucher, setDadosVoucher] = useState(null);

  const props = { setTela, setParceiroAtivo, setDadosVoucher };

  if (tela==="cadastro"&&parceiroAtivo)  return <PaginaCadastro parceiro={parceiroAtivo} setTela={setTela} setDadosVoucher={setDadosVoucher}/>;
  if (tela==="voucher"&&dadosVoucher)    return <PaginaVoucher dados={dadosVoucher} setTela={setTela}/>;
  if (tela==="cliente-voucher-busca")    return <PaginaBuscaVoucher setTela={setTela} setDadosVoucher={setDadosVoucher}/>;
  if (tela==="parceiro-login")           return <PaginaParceiroLogin setTela={setTela} setParceiroAtivo={setParceiroAtivo}/>;
  if (tela==="parceiro-portal"&&parceiroAtivo) return <PaginaParceiroPortal parceiro={parceiroAtivo} setTela={setTela}/>;
  if (tela==="admin-login")              return <PaginaAdminLogin setTela={setTela}/>;
  if (tela==="admin")                    return <PaginaAdmin setTela={setTela}/>;
  return <PaginaHome setTela={setTela} setParceiroAtivo={setParceiroAtivo}/>;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
